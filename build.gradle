plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.138'
}

version = '1.0.0'
group = 'com.sk0ne.framedlift'

base {
    archivesName = 'framedlift'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    // FramedBlocks с CurseForge
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
    }
    // Create, Ponder, Flywheel
    maven {
        name = "Create Maven"
        url = "https://maven.createmod.net"
    }
    // Registrate
    maven {
        name = "Registrate Snapshots"
        url = "https://maven.ithundxr.dev/snapshots"
    }
    // Sable (Create: Aeronautics)
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
        }
        data {
            data()
            gameDirectory = project.file('run-data')
        }
    }

    mods {
        framedlift {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // FramedBlocks (NeoForge 1.21.1)
    implementation "curse.maven:framedblocks-441647:6872949"

    // Create (NeoForge 1.21.1)
    implementation("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}:slim") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${project.ponder_version}+mc${project.minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${project.minecraft_version}:${project.flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}:${project.flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${project.registrate_version}"

    // Sable (Create: Aeronautics)
    implementation "dev.ryanhcode.sable:sable-common-${project.minecraft_version}:${project.sable_version}"
}

// Подключаем шаблоны как источник ресурсов (там лежит neoforge.mods.toml)
sourceSets.main.resources {
    srcDir 'src/main/templates'
}

// Подставляем значения из gradle.properties в neoforge.mods.toml
processResources {
    def props = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_group_id           : project.mod_group_id,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description
    ]
    inputs.properties props

    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
