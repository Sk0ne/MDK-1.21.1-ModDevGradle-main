plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.138'
}

version = '1.0.0'
group = 'com.sk0ne.framedlift'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// --- РЕПОЗИТОРИИ ---
repositories {
    // Основное зеркало для NeoForge (обход блокировки)
    exclusiveContent {
        forRepository {
            maven {
                name = "NeoForged Mirror"
                url = "https://neoforged.forgecdn.net/releases"
            }
        }
        filter {
            includeGroup "net.neoforged"
        }
    }

    // FramedBlocks (через Curse Maven)
    exclusiveContent {
        forRepository {
            maven {
                name = "Curse Maven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    // Create и его зависимости
    maven {
        name = "Create Maven"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Registrate Snapshots"
        url = "https://maven.ithundxr.dev/snapshots"
    }

    // Sable (Create: Aeronautics)
    exclusiveContent {
        forRepository {
            maven {
                name = "RyanHCode Maven"
                url = "https://maven.ryanhcode.dev/releases"
            }
        }
        filter {
            includeGroup "dev.ryanhcode.sable"
            includeGroup "dev.ryanhcode.sable-companion"
        }
    }

    // Стандартные репозитории
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
}

// --- НАСТРОЙКА NEOFORGE ---
neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
        }
        data {
            data()
            gameDirectory = project.file('run-data')
        }
    }

    mods {
        framedlift {
            sourceSet sourceSets.main
        }
    }
}

// --- ЗАВИСИМОСТИ ---
dependencies {
    // FramedBlocks (NeoForge 1.21.1)
    // Координаты взяты с CurseForge: https://www.curseforge.com/minecraft/mc-mods/framedblocks/files/6872949
    implementation "curse.maven:framedblocks-441647:6872949"

    // Create (NeoForge 1.21.1) и его обязательные транзитивные зависимости
    implementation("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}:slim") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:1.0.82+mc${project.minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${project.minecraft_version}:1.0.6"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}:1.0.6"
    implementation "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"

    // Sable (Create: Aeronautics) — аэродинамический движок
    // Координаты: https://maven.ryanhcode.dev/releases/dev/ryanhcode/sable/sable-common-1.21.1/
    implementation "dev.ryanhcode.sable:sable-common-${project.minecraft_version}:${project.sable_version}"
}
