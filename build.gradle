plugins {
    id 'net.neoforged.moddev' version '1.0.17'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    // Настройки запуска — нужны только локально, на CI работают runData и build
    runs {
        client {
            client()
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--all', '--output',
                    file('src/generated/resources/').absolutePath
        }
    }

    mods {
        framedlift {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    // FramedBlocks — только CurseForge, cursemaven — резолвер к нему
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
    }
    // Create / Ponder / Flywheel
    maven {
        name = "Create Maven"
        url = "https://maven.createmod.net"
    }
    // Registrate
    maven {
        name = "Registrate"
        url = "https://maven.ithundxr.dev/snapshots"
    }
    // Sable
    maven {
        name = "RyanHCode"
        url = "https://maven.ryanhcode.dev/releases"
    }
    // Veil (транзитивная зависимость Sable)
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    // ForgeConfigAPIPort (транзитивная зависимость Sable)
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    mavenCentral()
}

dependencies {
    implementation "curse.maven:framedblocks-441647:6872949"
    implementation "dev.ryanhcode.sable:sable-common-1.21.1:2.0.6"
    implementation "dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.6"
    implementation "com.simibubi.create:create-1.21.1:6.0.4-84"
    implementation "net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.30"
    implementation "net.createmod.catnip:Catnip-NeoForge-1.21.1:0.11.32"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def props = [mod_version: project.mod_version]
    inputs.properties props

    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

sourceSets.main.resources {
    srcDir 'src/main/templates'
    srcDir 'src/generated/resources'
}
