plugins {
    id 'net.neoforged.moddev' version '1.0.17'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--all', '--output',
                    file('src/generated/resources/').absolutePath
        }
    }

    mods {
        framedlift {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    // FramedBlocks — публикуется только на CurseForge
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
    }
    // Create / Ponder / Flywheel
    maven {
        name = "Create Maven"
        url = "https://maven.createmod.net"
    }
    // Registrate
    maven {
        name = "Registrate"
        url = "https://maven.ithundxr.dev/snapshots"
    }
    // Sable
    maven {
        name = "RyanHCode"
        url = "https://maven.ryanhcode.dev/releases"
    }
    // Veil (транзитивная зависимость Sable)
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    // ForgeConfigAPIPort (транзитивная зависимость Sable)
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    mavenCentral()
}

dependencies {
    // FramedBlocks
    implementation "curse.maven:framedblocks-441647:6872949"

    // Create: slim = без вшитых зависимостей, поэтому Ponder/Flywheel/Registrate ниже
    implementation("com.simibubi.create:create-1.21.1:6.0.10-280:slim") { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6"
    implementation "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"

    // Sable: ТОЛЬКО neoforge-вариант. sable-common объявлять нельзя —
    // оба модуля публикуются с одной capability и Gradle падает с конфликтом
    implementation "dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.6"
}

// Sable тянет ForgeConfigAPIPort 21.1.3, которой нет на maven Fuzs —
// принудительно берём 21.1.6 (есть, под ту же 1.21.1)
configurations.configureEach {
    resolutionStrategy.force "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:21.1.6"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def props = [mod_version: project.mod_version]
    inputs.properties props

    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

sourceSets.main.resources {
    srcDir 'src/main/templates'
    srcDir 'src/generated/resources'
}
