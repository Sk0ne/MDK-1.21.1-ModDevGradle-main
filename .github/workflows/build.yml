name: Build Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Кэш Gradle-обёртки и скачанных зависимостей — основной ресурс
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Кэш NeoFormRuntime: декомпилированный Minecraft, патчи, asset'ы игры
      - name: Cache NeoForm / Minecraft assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/neoformruntime
          key: neoform-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            neoform-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run data generation
        run: ./gradlew runData --no-daemon

      - name: Commit generated data
        id: commit-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/generated/resources || true
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Нет изменений в сгенерированных данных"
          else
            git commit -m "chore: regenerate datagen output [skip ci]"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Verify jar contains neoforge.mods.toml
        run: |
          unzip -l build/libs/framedlift-*.jar | grep -q "META-INF/neoforge.mods.toml" \
            && echo "neoforge.mods.toml: OK" \
            || { echo "::error::neoforge.mods.toml отсутствует в jar!"; unzip -l build/libs/framedlift-*.jar; exit 1; }

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: framedlift-${{ github.sha }}
          path: |
            build/libs/framedlift-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
